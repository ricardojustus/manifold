# <name> overlay manifest — overlay METADATA (distinct from the install-time
# .claude/manifold-manifest.yaml the installer writes into a target repo).
# Copy this file when you copy _template to overlays/<name>/. Fill every field; keep it in
# sync with the files under this overlay by hand.

name: <name>                 # must equal the overlays/<name>/ directory name
runtime: claude-code
description: <one line — what this overlay adapts core to>

# The core generation this overlay is written for (matches core/GENERATION in the harness
# clone). install.sh REFUSES to install an overlay older than the core. Bump this ONLY by
# running /harness-migrate-overlay — that skill re-shapes the slots first and stamps this
# key last, on the owner's yes.
core_generation: 2

# Install profile: `base` = the core discipline set (the facts core + floor + continuity card,
# the cards and kept skills, the two agent roles); `full` = base + every optional module.
# Optional modules (enable individually via `modules:` below or --modules at install time):
#   inter-session — the peer-session messaging bus (ships a Python runtime; only useful when
#                   the project runs multiple coordinated Claude Code sessions on one machine)
#   multi-agent   — parallel-workstreams + merge-and-cleanup (multi-lane worktree dispatch)
#   atlas         — decision records (adr/) + a hand-written architecture orientation file;
#                   ships two templates and owns no skills
# New adopters start at base; enable modules when the need is real, not speculatively.
profile: base
modules:                     # e.g.: inter-session multi-agent

# Binds the core <artifact-root> token (the Evidence Store: the project root where audit/council
# records live). install.sh substitutes it into every staged .md file; if this key is REMOVED
# the install FAILS CLOSED (nothing written), same as an unfilled slot. The default `.` (the
# installed target's own root) lets a freshly-copied template install out of the box — CHANGE it
# to your project's audit/evidence dir (absolute path, or a dir relative to the installed target).
artifact_root: .

# One entry per {{HARNESS:...}} placeholder in core/CLAUDE.scaffold.md. EVERY placeholder
# needs a claude-slots/<slot>.md file or the install fails closed. Current slot set:
claude_slots:
  - identity
  - user_import
  - system_map
  - accounts
  - model_pins
  - comms_style
  - project_hard_rules

# Core skills that get a project binding appended on install (skill-bindings/<skill>.md).
skill_bindings: []

# Project-only skills shipped by this overlay (skills/<name>/SKILL.md).
skills: []

# Project rules installed to .claude/rules/ (rules/<file>.md). None by default: model pins
# now live in the `model_pins` slot, in the constitution itself.
rules: []

# Enforcement hook bindings for core/ENFORCEMENT.md bright-lines (hooks/<script>.sh).
# DRAFT on install (not wired into settings.json). exit 2 = block, exit 0 = allow.
hooks: []
